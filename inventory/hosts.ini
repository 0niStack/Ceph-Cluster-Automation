# private_ip = the VPC private IP (used for the Ceph cluster network)
# ansible_host = IP you SSH to (public IP, or private if you run from inside the VPC)
[ceph]
ceph1 ansible_host=1.1.1.1 private_ip=10.0.1.11
ceph2 ansible_host=2.2.2.2 private_ip=10.0.1.12
ceph3 ansible_host=3.3.3.3 private_ip=10.0.1.13

# The node that runs `cephadm bootstrap` (first mon/mgr)
[bootstrap]
ceph1

[ceph:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
