# private_ip = the VPC private IP (used for the Ceph cluster network)
# ansible_host = IP you SSH to (public IP, or private if you run from inside the VPC)
[ceph]
ceph1 ansible_host=35.175.182.230 private_ip=172.31.18.231
ceph2 ansible_host=34.207.181.81 private_ip=172.31.17.16
ceph3 ansible_host=52.54.117.110 private_ip=172.31.22.102

# The node that runs `cephadm bootstrap` (first mon/mgr)
[bootstrap]
ceph1

[ceph:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3



